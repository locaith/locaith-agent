[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locaith-cli"
version = "0.4.4"
description = "Locaith CLI — trợ lý lập trình Locaith ngay trong terminal, như Claude Code / Codex: giao diện đẹp, đọc/sửa tệp, chạy lệnh, MCP, hooks, rewind, cùng lõi với extension VS Code. Cài: pip install locaith-cli"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Locaith Solution Tech", email = "locaithsolution@locaith.com" }]
keywords = ["locaith", "cli", "agent", "ai", "terminal", "coding-agent", "assistant", "mcp", "claude-code", "codex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
]
# Node.js đi kèm (wheel của nodejs-wheel-binaries) để `pip install locaith-cli` là chạy được, không cần cài Node riêng.
# Nếu máy đã có Node >= 20 thì launcher dùng Node của hệ thống.
dependencies = ["nodejs-wheel-binaries>=20"]

[project.urls]
Homepage = "https://locaith.ai"
Source = "https://github.com/locaith/locaith-agent"
Changelog = "https://github.com/locaith/locaith-agent/blob/main/extension/CHANGELOG.md"

[project.scripts]
locaith = "locaith_cli.cli:main"

[tool.setuptools]
packages = ["locaith_cli"]

[tool.setuptools.package-data]
locaith_cli = ["bin/*.cjs"]
