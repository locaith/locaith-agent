[build-system]
# setuptools >= 77 để khai báo giấy phép theo SPDX (PEP 639) — bản này cần Python >= 3.9 để DỰNG gói (CI dựng bằng Python 3.12);
# gói dựng ra là wheel thuần Python và vẫn chạy trên Python 3.8 (requires-python bên dưới).
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locaith-cli"
version = "0.4.10"
description = "Locaith CLI — trợ lý lập trình Locaith ngay trong terminal, như Claude Code / Codex: giao diện đẹp, đọc/sửa tệp, chạy lệnh, MCP, hooks, rewind, cùng lõi với extension VS Code. Cài: pip install locaith-cli"
readme = "README.md"
requires-python = ">=3.8"
# Functional Source License 1.1 (mã nguồn chuyển sang Apache-2.0 sau 2 năm) — mã SPDX chính thức; văn bản đầy đủ nằm trong tệp LICENSE.
license = "FSL-1.1-ALv2"
license-files = ["LICENSE"]
authors = [{ name = "Locaith Solution Tech", email = "locaithsolution@locaith.com" }]
keywords = ["locaith", "cli", "agent", "ai", "terminal", "coding-agent", "assistant", "mcp", "claude-code", "codex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
]
# Node.js đi kèm (wheel của nodejs-wheel-binaries) để `pip install locaith-cli` là chạy được, không cần cài Node riêng.
# Nếu máy đã có Node >= 20 thì launcher dùng Node của hệ thống.
dependencies = ["nodejs-wheel-binaries>=20"]

[project.urls]
Homepage = "https://locaith.ai"
Source = "https://github.com/locaith/locaith-agent"
Changelog = "https://github.com/locaith/locaith-agent/blob/main/extension/CHANGELOG.md"

[project.scripts]
locaith = "locaith_cli.cli:main"

[tool.setuptools]
# `locaith_cli/bin` (bundle locaith.cjs do build.mjs sinh ra) khai báo rõ là một gói: không còn cảnh báo «absent from packages», và nếu quên chạy
# build.mjs thì dựng gói THẤT BẠI ngay (trước đây ra một wheel thiếu lõi mà không báo gì).
packages = ["locaith_cli", "locaith_cli.bin"]

[tool.setuptools.package-data]
locaith_cli = ["bin/*.cjs"]
