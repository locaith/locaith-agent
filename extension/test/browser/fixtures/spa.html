<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ứng dụng một trang (SPA)</title>
</head>
<body>
<h1>Bảng điều khiển</h1>
<p id="status">Đang chờ…</p>
<button type="button" id="go" onclick="route()">Đi tới mục Báo cáo</button>
<script>
  // Đổi đường dẫn kiểu SPA (pushState) ở 400ms rồi hiện nội dung ở 1200ms: lời gọi page_wait đang chạy KHÔNG được coi là "trang đã chuyển".
  function route() {
    setTimeout(() => history.pushState({}, '', '/bao-cao'), 400);
    setTimeout(() => { document.getElementById('status').textContent = 'Kết quả đã tải xong'; }, 1200);
  }
</script>
</body>
</html>
