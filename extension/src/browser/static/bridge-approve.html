<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locaith AI — VS Code</title>
<style>
  :root { color-scheme: light dark; --brand:#625aec; --cyan:#22bcec; --bad:#e5484d; --line:#8884; }
  body { margin:0; padding:18px 20px; font:14px/1.5 system-ui,'Be Vietnam Pro',sans-serif; }
  h1 { font-size:16px; margin:0 0 8px; }
  .origin { font:600 15px/1.4 ui-monospace,Consolas,monospace; word-break:break-all; padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin:8px 0 12px; }
  p { margin:6px 0; } .hint { font-size:12.5px; opacity:.75; }
  .btns { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:9px 14px; cursor:pointer; color:#fff; background:linear-gradient(160deg,var(--cyan),var(--brand)); }
  button.alt { background:transparent; color:inherit; border:1px solid var(--line); } button.bad { background:var(--bad); }
</style>
</head>
<body>
<h1 id="title"></h1>
<div class="origin" id="origin"></div>
<p id="what"></p>
<p class="hint" id="hint"></p>
<div class="btns">
  <button id="once"></button>
  <button id="always" class="alt"></button>
  <button id="deny" class="bad"></button>
</div>
<script src="bridge-approve.js"></script>
</body>
</html>
